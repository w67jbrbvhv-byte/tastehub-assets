# ---------------------------------------------------------------------------
# Copy this to config.yaml and edit. config.yaml is git-ignored.
# ---------------------------------------------------------------------------

# Only "paper" is accepted. There is no live mode in this codebase.
mode: paper

base_currency: GBP

# The benchmark the agent is measured against. Must appear in `universe`.
# Everything the agent does is judged against simply holding this instead.
benchmark: VUAG

ibkr:
  host: 127.0.0.1
  # 4002 = IB Gateway paper, 7497 = TWS paper.
  # 4001 and 7496 are the LIVE ports and are rejected by this program.
  port: 4002
  client_id: 17
  # Leave blank to use the first managed account the Gateway reports.
  # Must be a DU... paper account; a U... live account aborts the run.
  account: ""
  # 1 = live data, 2 = frozen, 3 = delayed (15 min), 4 = delayed frozen.
  # Use 3 unless you pay for the relevant market data subscriptions.
  market_data_type: 3
  connect_timeout: 20.0
  # Trading days of daily bars to pull per instrument.
  history_days: 400

llm:
  # The strategist runs weekly and sets the rules.
  strategist_model: claude-opus-5
  # The trader runs daily and may only apply those rules.
  trader_model: claude-opus-5
  effort: high        # low | medium | high | xhigh | max
  max_tokens: 16000

risk:
  # Hard limits, enforced in code. The models cannot talk their way past these.
  max_position_pct: 20.0        # max % of NAV in any one instrument
  max_positions: 8              # max number of simultaneous holdings
  min_cash_pct: 5.0             # cash floor, % of NAV
  max_trade_pct: 10.0           # max % of NAV in a single order
  max_orders_per_day: 4
  max_daily_turnover_pct: 25.0  # total traded value per day, % of NAV
  drawdown_halt_pct: 20.0       # halt all trading below this drawdown from peak NAV
  min_order_value: 250.0        # skip dust orders (base currency)
  limit_offset_bps: 25.0        # default limit price offset from last, basis points
  max_limit_deviation_pct: 2.0  # reject a model limit price further than this from last
  price_decimals: 2

# ---------------------------------------------------------------------------
# The crash ladder: what happens when the market falls hard.
#
# Decided here, in advance, in the cold light of day. No model is consulted
# during the event — the entire value of the plan is that it was made while you
# were calm. See PLAYBOOK.md.
# ---------------------------------------------------------------------------
crash_ladder:
  enabled: true

  # Cash held back from the strategy, as % of NAV. The strategy cannot see it
  # and cannot spend it. This drags returns in every year nothing happens —
  # that drag is the premium you pay for having ammunition when it does.
  reserve_pct: 25.0

  # What to buy on the way down. Blank = the benchmark. Broad and liquid:
  # in a crisis, narrow ETFs gap and their spreads blow out.
  target: VWRP

  # Rungs re-arm only once the benchmark is back within this much of its high,
  # so a choppy market cannot re-trigger a rung that already fired.
  rearm_within_pct: 5.0

  # A crash is exactly when the normal 20% position cap must not apply —
  # concentrating into the broad market is the intent, not an accident.
  max_position_pct: 60.0

  # Spreads widen enormously in a fall. A 25bps limit simply will not fill.
  limit_offset_bps: 150.0

  # If the cash floor blocks part of a tranche, carry the remainder forward
  # rather than abandoning it.
  carry_unfilled: true

  # Deeper falls buy more, because they are rarer and the expected return from
  # deploying into them is higher. Measured on the BENCHMARK's drawdown from its
  # own 252-day high — you buy because the market fell, not because you did badly.
  tranches:
    - {drawdown_pct: 15.0, deploy_pct: 20.0}
    - {drawdown_pct: 25.0, deploy_pct: 25.0}
    - {drawdown_pct: 35.0, deploy_pct: 30.0}
    - {drawdown_pct: 50.0, deploy_pct: 25.0}

# Refusing to act on data you do not trust. A bad print and a real collapse look
# identical when they arrive; both stop the run, ladder included.
data_guard:
  min_bars: 60
  max_stale_days: 5
  max_daily_move_pct: 25.0
  max_median_deviation_pct: 35.0

# What a paper fill does not charge you. Used in reporting only, to haircut the
# paper record before comparing it with buy-and-hold.
friction:
  commission_per_order: 3.0
  half_spread_bps: 6.0
  impact_bps: 2.0

# The tradable universe. The agent may not touch anything not listed here.
# Deliberately liquid, long-only, unlevered ETFs.
universe:
  - symbol: VUAG
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard S&P 500 UCITS ETF (Acc)
  - symbol: VWRP
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard FTSE All-World UCITS ETF (Acc)
  - symbol: VUKG
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard FTSE 100 UCITS ETF (Acc)
  - symbol: VERG
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard FTSE Developed Europe UCITS ETF (Acc)
  - symbol: VFEG
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard FTSE Emerging Markets UCITS ETF (Acc)
  - symbol: VAGS
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard Global Aggregate Bond UCITS ETF (GBP Hedged, Acc)
  - symbol: VGOV
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: Vanguard UK Gilt UCITS ETF
  - symbol: SGLN
    exchange: SMART
    primary_exchange: LSEETF
    currency: GBP
    name: iShares Physical Gold ETC

paths:
  journal: data/journal.sqlite
  strategy: strategy/STRATEGY.md
  strategy_archive: strategy/versions
  halt_file: HALT
